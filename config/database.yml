default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") { "postgres" } %>
  password: <%= ENV.fetch("DB_PWD") { "password" } %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: wisp3_development

test:
  <<: *default
  # bin/e2e runs the browser smoke tests on their own database
  database: <%= ENV["E2E"] ? "wisp3_e2e" : "wisp3_test" %>

# Staging and production run on hosts with a local Postgres; the app connects as "wisp3" with
# the password from that environment's Rails credentials (database.password).
production:
  primary: &primary_production
    <<: *default
    database: wisp3_production
    username: wisp3
    password: <%= ENV["WISP3_DATABASE_PASSWORD"] || Rails.application.credentials.dig(:database, :password) %>
  cache:
    <<: *primary_production
    database: wisp3_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: wisp3_production_queue
    migrations_paths: db/queue_migrate

staging:
  primary: &primary_staging
    <<: *primary_production
    database: wisp3_staging
  cache:
    <<: *primary_staging
    database: wisp3_staging_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_staging
    database: wisp3_staging_queue
    migrations_paths: db/queue_migrate
