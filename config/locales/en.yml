# Attribute names as growers see them in validation messages ("Soil moisture must be between 0
# and 100", not "Soil moisture pct must be in 0..100")
en:
  activerecord:
    attributes:
      field_entry: &daily_entry
        rain_in: Rain
        irrigation_in: Irrigation
        soil_moisture_pct: Soil moisture
      field_group_entry: *daily_entry
      canopy_observation:
        pct_cover: Percent cover
        lai: LAI
      planting:
        plant: Crop
        max_root_zone_depth: Root zone depth
        mad_frac: MAD
        et_method: Canopy method
        target_ad_pct: Target AD
        initial_moisture_pct: Starting soil moisture
        season_start: Season start
        emergence_date: Emergence
        end_date: Harvest or kill date
      field:
        area_acres: Area
        soil_type: Soil
        field_capacity: Field capacity
        perm_wilting_pt: Wilting point
      pivot:
        radius_ft: Radius
        pump_capacity_gpm: Pump capacity
        arc_start_deg: Arc start
        arc_end_deg: Arc end
      pivot_irrigation:
        inches: Amount
        run_hours: Run hours
        field_ids: Fields
