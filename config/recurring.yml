# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production: &production
  # Weather; times are US Central
  weather_refresh:
    class: WeatherRefreshJob
    schedule: at 5am, 11am and 5pm America/Chicago
  weather_finalize:
    class: WeatherFinalizeJob
    schedule: at 3am every day America/Chicago
  # After the 5am refresh
  daily_digest:
    class: DailyDigestJob
    schedule: at 6am every day America/Chicago
  # After the digest: emails the admins failed jobs and missing weather
  health_check:
    class: HealthCheckJob
    schedule: at 7am every day America/Chicago
  forecast_prune:
    class: ForecastPruneJob
    schedule: at 4am every sunday America/Chicago
  # Accounts still unconfirmed 30 days after signing up (UnconfirmedAccountPurgeJob)
  unconfirmed_account_purge:
    class: UnconfirmedAccountPurgeJob
    schedule: at 4:15am every day America/Chicago
  # Failed jobs are reported by the health check the morning after; kept a week for a retry
  discard_old_failed_jobs:
    command: "SolidQueue::FailedExecution.where(created_at: ...7.days.ago).discard_all_in_batches"
    schedule: at 4:30am every day America/Chicago
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

staging:
  <<: *production
