# Overrides of transitive dependencies, each with its reason.
overrides:
  # @tailwindcss/typography pins 6.0.10, which has a quadratic-time selector parsing advisory
  # (GHSA-rj75-hqrm-r3gf, fixed in 7.1.6). Build time only; the built CSS is identical with 7.
  "@tailwindcss/typography>postcss-selector-parser": 7.1.6
  # eslint, @eslint/config-array and typescript-estree pin minimatch 10.2.6, which has a DoS advisory
  # (GHSA-g3hv-75wg-m249, fixed in 11.0.1). Dev tooling only. Drop this once `pnpm why minimatch`
  # shows only >=11.0.1 without the override (pnpm audit stays clean).
  minimatch: ">=11.0.1"
