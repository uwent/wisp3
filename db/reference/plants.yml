# Crops, carried over from the legacy app (../wisp/db/plants.yml).
# Default root zone depths: Table 3.4 of NRCS National Engineering Handbook part 652
# (http://www.nrcs.usda.gov/Internet/FSE_DOCUMENTS/nrcs141p2_017640.pdf); mint from FAO-56
# (http://www.fao.org/docrep/x0490e/x0490e0e.htm).
# canopy_model: the LAI growth curve used when a planting uses the LAI method without entered
# readings (CanopyModel). Only field corn has a validated curve (PLAN.md Q2); other crops can use
# LAI only with entered readings.

- key: potato
  name: Potato
  default_max_root_zone_depth: 16.0
- key: sweet_corn
  name: Sweet Corn
  default_max_root_zone_depth: 27.0
