# Crops, carried over from the legacy app (../wisp/db/plants.yml).
# Default root zone depths: Table 3.4 of NRCS National Engineering Handbook part 652
# (http://www.nrcs.usda.gov/Internet/FSE_DOCUMENTS/nrcs141p2_017640.pdf); mint from FAO-56
# (http://www.fao.org/docrep/x0490e/x0490e0e.htm).
# canopy_model: the LAI growth curve used when a planting uses the LAI method without entered
# readings (CanopyModel). Only crops with one can use the LAI method (PLAN.md Phase 6.7); so far
# that's field corn (and corn silage, on the same curve).
# Added in PLAN.md Phase 8 G.7: dry bean (2.5–3 ft) and sugar beet (3 ft) from University of Nebraska
# EC3015's table of root zone depths (citing NRCS); sorghum as field corn, both 3–4 ft effective
# rooting in UNL NebGuide G2245; corn silage as field corn; oats as barley and wheat.

# Crop coefficients and heights (PLAN.md §9 C21, C22, C25) are from FAO-56's second edition: Pereira,
# L. S., Allen, R. G., Paredes, P., López-Urrea, R., Raes, D., Smith, M., Kilic, A. & Salman, M.
# (2025), Crop evapotranspiration: Guidelines for computing crop water requirements, FAO Irrigation
# and Drainage Paper 56 Rev.1, Rome, FAO, https://doi.org/10.4060/cd6621en (CC BY 4.0). They replace
# the 1998 edition's Tables 12 and 17 (Allen et al. 1998) since C25 (2026-11-19). All are for the
# standard subhumid climate (RHmin ≈ 45%, wind ≈ 2 m/s), and adjusted for each day's wind and
# humidity (eqs. 6.16 and 7.2, CropEt.kc_mid; kcb_end only when 0.45 or more, as Rev.1 does).
#
# kc_mid and crop_height_m: the single crop coefficient at full cover against grass reference ET, and
# the crop's maximum height, from Rev.1 Table 6.1 (vegetables, pp. 165–167), 6.2 (field crops,
# pp. 168–169) or 6.4 (grasslands, p. 176). Since C22, kc_mid is shown on the About page and used by
# LegacyEngine's C21 path, but no longer runs the balance; crop_height_m adjusts both coefficients
# for the climate and enters the density coefficient Kd (Kcb from cover, eq. 9.13; 1998 eq. 98).
#
# kcb_mid and kcb_end: the basal crop coefficient (transpiration, with the soil surface dry) at full
# cover in mid season and at harvest, from Rev.1 Table 7.1 (vegetables, pp. 217–219) or 7.2 (field
# crops, pp. 220–221), the same row as kc_mid. The water balance adds soil evaporation to it
# (SoilEvaporation) and ramps kcb_mid to kcb_end from the canopy curve's decline to the end date.
#
# Rows: potato short season (Ben, 2026-11-19: against the Central Sands towers it matches August,
# while vines are green and irrigated, far better than long season's Kcb 0.30 at harvest, which put
# August 7–18% low; docs/et-validation/06-season.md); common bean green (snap bean) and dry (dry
# bean); pea fresh (shell peas); onions dry; common cabbage; table beets (beets); bell pepper
# (pepper); peppermint, single harvest (mint: Upper Midwest peppermint is mostly cut once; multiple
# harvests is Kcb 0.90 / 0.85); tomato fresh market, without trellis (processing is 0.75 at harvest);
# melon; pumpkin, winter squash (pumpkin and winter squash); zucchini, squash (summer squash);
# cucumber fresh market; maize grain, high grain moisture at harvest (field corn; low moisture is
# 0.25 at harvest); maize silage (corn silage, Ben 2026-11-19; 2.50–3.20 m);
# maize sweet (sweet corn); sorghum grain; wheat common, spring, low grain moisture at harvest (wheat:
# Wisconsin's wheat is combined dry, and winter wheat's low moisture row has the same Kc mid and Kcb,
# 1.15 and 1.10 / 0.20; high moisture is 0.40 at harvest); sugar beet; barley; oats; soybean;
# sweet potato; asparagus; carrots; broccoli; celery. Where a table gives a range, the middle: the
# heights of field corn (2.50–3.50 m), sweet corn (1.50–2.50), beans (0.50–0.70), barley
# (0.70–0.90), oats (0.80–1.10), wheat (0.70–1.10), sorghum (1.50–2.00) and mint (0.30–0.50); leafy
# greens between spinach (Kc 1.05, Kcb 0.95 / 0.95, 0.35 m) and lettuce (1.05, 1.00 / 1.00,
# 0.35 m), 0.98 / 0.98.
#
# Bell pepper and zucchini take Table 7.1's Kcb (1.00 / 0.70 and 0.90 / 0.60), where Table 9.1's
# standard Kcb (p. 311, from the A&P approach) differs (1.05 / 1.00 and 0.95 / 0.65).
#
# Alfalfa: Table 6.4's alfalfa for hay, typical multiple cutting cycles, Kc mid 1.20 (WISP models
# each cutting's regrowth in the canopy, CutCanopy). Rev.1 has no alfalfa row in Table 7.x; its
# Kcb, 1.05 / 1.05, is Table 9.4's standard Kcb for the same row (p. 327), and its height the middle
# of that row's 0.50–0.75 m.
#
# Other and garden vegetables: Rev.1 drops the 1998 edition's small vegetables group (Kc 1.05, Kcb
# 0.95 / 0.85, 0.4 m), so they take the median of Rev.1's rows for that group's crops (broccoli,
# cabbage, carrots, cauliflower, celery, lettuce, onions dry, radish, spinach): Kc 1.05, Kcb 1.00 /
# 0.95, 0.40 m.
#
# Potato's kcb_end (0.50) acts only from the late stage's start (its July 25 decline) to vine kill,
# as the slope of the ramp to harvest: WISP models vine kill in the canopy (it ramps to 0% cover), so
# Kcb is 0 after it whatever Kcb end is, and the soil's evaporation is what's left. The 1998
# edition's 0.65 (Table 17's main value; its note gave about 0.35 for long-season potato with vine
# kill) held Kcb higher through the decline.

