# Crops, carried over from the legacy app (../wisp/db/plants.yml).
# Default root zone depths: Table 3.4 of NRCS National Engineering Handbook part 652
# (http://www.nrcs.usda.gov/Internet/FSE_DOCUMENTS/nrcs141p2_017640.pdf); mint from FAO-56
# (http://www.fao.org/docrep/x0490e/x0490e0e.htm).
# canopy_model: the LAI growth curve used when a planting uses the LAI method without entered
# readings (CanopyModel). Only crops with one can use the LAI method (PLAN.md Phase 6.7); so far
# that's field corn (and corn silage, on the same curve).
# Added in PLAN.md Phase 8 G.7: dry bean (2.5–3 ft) and sugar beet (3 ft) from University of Nebraska
# EC3015's table of root zone depths (citing NRCS); sorghum as field corn, both 3–4 ft effective
# rooting in UNL NebGuide G2245; corn silage as field corn; oats as barley and wheat.

# kc_mid and crop_height_m (PLAN.md §9 C21, Q11): the crop coefficient at full cover against FAO-56
# grass reference ET, and the crop's mean maximum height, from FAO-56 Table 12 (Allen et al. 1998,
# https://www.fao.org/4/x0490e/x0490e0b.htm, for RHmin ≈ 45% and wind ≈ 2 m/s; CropEt adjusts Kc mid
# for each day's wind and humidity, eq. 62). Rows: beans green (snap bean), peas fresh (shell peas),
# onions dry, pumpkin/winter squash (pumpkin too), squash zucchini (summer squash), sweet melons
# (melon), spinach and lettuce (leafy greens), maize field (field corn and corn silage), beans dry and
# pulses (dry bean). Where the table gives a range, the middle: soybean height 0.5–1.0 m, mint
# 0.6–0.8 m, asparagus 0.2–0.8 m, sorghum Kc 1.00–1.10 and 1–2 m. Alfalfa takes the individual
# cutting periods' 1.20 (not the averaged 0.95), as WISP models each cutting's regrowth in the canopy
# (CutCanopy). Other and garden vegetables take the small vegetables group's 1.05, at 0.4 m.

